<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 발명 연구소</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<script defer src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@tensorflow-models/knn-classifier@1.2.6/dist/knn-classifier.min.js"></script>
<style>
:root{
  --note:#fff4b8;
  --bg:#fbf6ec; --paper:#fffdf8; --ink:#1f2a44; --sub:#5b6478; --line:#e7dfcf;
  --accent:#ff6b4a; --accent2:#2bb3a3; --soft:#fff1e6; --soft2:#e6f6f3; --warn:#c0392b;
  --shadow:0 2px 0 rgba(31,42,68,.08), 0 8px 24px rgba(31,42,68,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Pretendard,system-ui,sans-serif;font-size:17px;line-height:1.55;
  background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px}
h1,h2,h3,.jua{font-family:Jua,Pretendard,sans-serif;font-weight:400;letter-spacing:-.2px}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:16px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.logo{display:flex;align-items:center;gap:10px}
.logo .bulb{width:44px;height:44px;border-radius:14px;background:var(--accent);display:grid;place-items:center;font-size:24px;box-shadow:var(--shadow)}
.logo h1{margin:0;font-size:28px}
.logo small{display:block;color:var(--sub);font-size:13px;font-family:Pretendard}
.team-tag{margin-left:auto;background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:4px 14px;font-weight:700;font-size:15px}
/* stepper */
.stepper{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:thin}
.stepper button{flex:0 0 auto;border:2px solid var(--ink);background:var(--paper);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:700;font-size:15px;display:flex;gap:6px;align-items:center}
.stepper button .n{width:22px;height:22px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:12px}
.stepper button.on{background:var(--ink);color:#fff}
.stepper button.on .n{background:var(--accent);color:#fff}
.stepper button.done .n{background:var(--accent2);color:#fff}
.card{background:var(--paper);border:2px solid var(--ink);border-radius:20px;padding:22px;box-shadow:var(--shadow)}
.step-title{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 4px}
.step-title h2{margin:0;font-size:30px}
.step-title .chip{background:var(--soft);border-radius:999px;padding:2px 12px;font-size:14px;color:var(--accent);font-weight:700}
.lead{color:var(--sub);margin:0 0 18px}
label.f{display:block;font-weight:700;margin:14px 0 6px}
input[type=text],input[type=password],textarea,select{width:100%;border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;outline:none;transition:border-color .15s}
input[type=text]:focus,input[type=password]:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{min-height:76px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600}
.chips button.on{border-color:var(--accent);background:var(--soft);color:var(--accent)}
.btn{border:2px solid var(--ink);background:var(--paper);border-radius:14px;padding:10px 18px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:transform .05s}
.btn:active{transform:translateY(2px)}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.tea{background:var(--accent2);color:#fff;border-color:var(--accent2)}
.btn.sm{padding:6px 12px;font-size:14px;border-radius:10px}
.btn.ghost{border-color:var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.nav{display:flex;justify-content:space-between;margin-top:22px;gap:10px}
.tip{margin-top:18px;border-left:5px solid var(--accent2);background:var(--soft2);border-radius:0 12px 12px 0;padding:10px 14px;font-size:15px}
.tip b{color:#16786d}
details.teacher{margin-top:14px;border:2px dashed var(--line);border-radius:12px;padding:8px 14px;font-size:15px;color:var(--sub)}
details.teacher summary{cursor:pointer;font-weight:700;color:var(--ink)}
.sentence{margin-top:16px;padding:16px;border-radius:16px;background:var(--ink);color:#fff;font-size:20px}
.sentence .jua{color:#ffd166}
/* examples */
.ex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:10px}
.ex{border:2px solid var(--line);border-radius:14px;padding:12px;background:#fff;cursor:pointer;text-align:left}
.ex:hover{border-color:var(--accent)}
.ex .e{font-size:28px}
.ex b{display:block;margin:4px 0 2px}
.ex span{font-size:13px;color:var(--sub)}
/* classes editor */
.cls-row{display:grid;grid-template-columns:62px 1fr 1.6fr 130px 40px;gap:8px;align-items:center;padding:10px;border-radius:14px;border:2px solid var(--line);margin-bottom:8px;background:#fff;border-left-width:8px}
.cls-row input.emo{text-align:center;font-size:22px;padding:6px}
.cls-row .x{border:none;background:none;font-size:20px;cursor:pointer;color:var(--sub)}
.cls-head{display:grid;grid-template-columns:62px 1fr 1.6fr 130px 40px;gap:8px;font-size:13px;color:var(--sub);font-weight:700;padding:0 12px}
/* camera */
.lab{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px}
.cam{position:relative;border-radius:18px;overflow:hidden;background:#1f2a44;aspect-ratio:4/3;border:2px solid var(--ink)}
.cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}
.cam video.nomirror,.cam.nomirror #poseCv{transform:none}
.camflip{position:absolute;right:10px;top:10px;border:0;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font-weight:700;font-size:13px;padding:4px 10px;cursor:pointer;z-index:3}
.cam .msg{position:absolute;inset:0;display:grid;place-items:center;color:#fff;text-align:center;padding:20px;font-size:16px}
.cam .badge{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:3px 10px;font-size:13px}
.status{font-size:14px;color:var(--sub);margin-top:8px;min-height:20px}
.collect{display:flex;flex-direction:column;gap:10px}
.col{border:2px solid var(--line);border-left-width:8px;border-radius:14px;padding:10px 12px;background:#fff}
.col .hd{display:flex;align-items:center;gap:8px}
.col .hd .nm{font-weight:800;flex:1}
.col .cnt{font-family:Jua;font-size:20px}
.col .bar{height:8px;border-radius:9px;background:var(--line);margin:8px 0;overflow:hidden}
.col .bar i{display:block;height:100%;width:0;border-radius:9px;transition:width .2s}
.col .acts{display:flex;gap:6px;flex-wrap:wrap}
.hold{user-select:none;-webkit-user-select:none;touch-action:none}
.hold.rec{animation:pulse .6s infinite alternate}
@keyframes pulse{to{filter:brightness(1.25);transform:scale(1.03)}}
.thumbs{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.thumbs img{width:34px;height:34px;border-radius:6px;object-fit:cover}
/* run */
.stage{border-radius:18px;border:2px solid var(--ink);min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px;transition:background .25s;background:#fff}
.stage .big{font-size:80px;line-height:1.1}
.stage .say{font-family:Jua;font-size:28px;margin-top:6px}
.stage .who{font-size:14px;color:var(--sub);margin-top:4px}
.conf{margin-top:12px}
.conf .r{display:grid;grid-template-columns:110px 1fr 46px;gap:8px;align-items:center;font-size:14px;margin:4px 0}
.conf .r .b{height:14px;border-radius:9px;background:var(--line);overflow:hidden}
.conf .r .b i{display:block;height:100%;transition:width .15s}
.ctrl{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:12px;font-size:15px}
.score{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;padding:12px;border-radius:14px;background:var(--soft)}
.score .acc{font-family:Jua;font-size:24px;margin-left:auto}
/* invention card */
.icard{background:#fff;border:3px solid var(--ink);border-radius:22px;overflow:hidden;max-width:620px;margin:0 auto;box-shadow:var(--shadow)}
.icard .ih{background:var(--ink);color:#fff;padding:16px 20px;display:flex;gap:14px;align-items:center}
.icard .ih .e{font-size:46px;background:#fff;border-radius:16px;width:68px;height:68px;display:grid;place-items:center}
.icard .ih h3{margin:0;font-size:28px;line-height:1.15}
.icard .ih small{opacity:.8}
.icard .ib{padding:16px 20px}
.icard .sec{margin-bottom:12px}
.icard .sec b{display:block;font-size:13px;color:var(--accent);letter-spacing:.5px;margin-bottom:2px}
.icard .rules{display:flex;flex-direction:column;gap:6px}
.icard .rule{display:flex;align-items:center;gap:10px;border-radius:12px;padding:6px 10px;border-left:6px solid}
.icard .rule img{width:40px;height:40px;border-radius:8px;object-fit:cover}
.icard .rule .em{font-size:24px}
.icard .if{flex:1;font-size:15px}
.icard .if strong{font-weight:800}
.icard .if:before{content:""}
.icard .meta{display:flex;gap:8px;flex-wrap:wrap}
.icard .meta span{background:var(--soft2);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700;color:#16786d}
.icard .ft{border-top:2px dashed var(--line);padding:8px 20px;font-size:12px;color:var(--sub);display:flex;justify-content:space-between}
/* gallery */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:14px}
.gal .icard{max-width:none}
.likes{display:flex;gap:6px;padding:8px 20px 12px;flex-wrap:wrap}
.likes button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px;cursor:pointer;font-weight:700;font-size:14px}
.likes button:hover{border-color:var(--accent)}
.empty{text-align:center;color:var(--sub);padding:40px 10px}
footer{text-align:center;color:var(--sub);font-size:13px;margin:20px 0 10px}
.hidden{display:none!important}
#printArea{display:none}
/* 감각 선택 */
.sense-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px}
.sense{border:2px solid var(--line);background:#fff;border-radius:16px;padding:12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px}
.sense span{font-size:30px}.sense b{font-family:Jua;font-weight:400;font-size:20px}.sense small{color:var(--sub);font-size:13px;line-height:1.35}
.sense.on{border-color:var(--accent);background:var(--soft);box-shadow:inset 0 0 0 1px var(--accent)}
.ex .e{display:flex;align-items:center;gap:8px}.sbadge{font-style:normal;font-size:11px;font-weight:800;background:var(--soft2);color:#16786d;border-radius:999px;padding:2px 8px}
/* 소리·자세 화면 */
.cam.spec{background:#14203c}
#specCv{width:100%;height:100%;display:block}
#poseCv{position:absolute;inset:0;width:100%;height:100%;transform:scaleX(-1);pointer-events:none}
.cam.spec .badge{z-index:2}
/* 헷갈림 노트 · 미션 */
.panels{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
.panel{border:2px solid var(--line);border-radius:16px;padding:14px;background:#fff;min-width:0}
.panel h3{margin:0 0 8px;font-size:22px}.panel h3 small{font-family:Pretendard;font-size:13px;color:var(--sub)}
.hint{font-size:13px;color:var(--sub);margin:6px 0}
.cm-wrap{overflow-x:auto}.cm{border-collapse:collapse;font-size:14px;width:100%}
.cm th,.cm td{border:1px solid var(--line);padding:6px 8px;text-align:center}.cm thead th{background:var(--soft);font-size:12px}.cm tbody th{text-align:left;white-space:nowrap;font-size:13px;background:#fafafa}
.cm td{font-weight:800;font-size:16px}
.topconf{margin:8px 0;padding:8px 12px;border-radius:10px;background:#ffe9e4;color:#b33b20;font-size:14px}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px;margin:8px 0}
.shots figure{margin:0;text-align:center}.shots img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:2px solid #ffc9bc}
.shots figcaption{font-size:11px;color:var(--sub);line-height:1.3;margin-top:2px}
.judge{margin-top:10px;padding:10px 12px;border-radius:12px;background:#fff6dc;font-size:14px}.judge .chips{margin-top:6px}.judge.ok{background:var(--soft2)}
.mission{border:2px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:8px;background:#fffdf8}
.mission summary{cursor:pointer;font-size:16px}.mission.done{border-color:#bfe8e2}.mission p{font-size:14px;margin:8px 0}
.mres{font-size:12px;background:var(--soft2);color:#16786d;border-radius:999px;padding:1px 8px;margin-left:4px}
.mq{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:14px;font-weight:700}
.mission textarea{min-height:56px;font-size:14px}
.biasbox{padding:8px 10px;border-radius:10px;background:var(--soft);font-size:14px;margin-bottom:8px}.biasbox .chips{margin-top:6px}.biasbox.on{background:#efe6ff;color:#5b2fc0}
.bias-banner{margin-top:14px;padding:10px 14px;border-radius:12px;background:#efe6ff;color:#5b2fc0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hintbox{margin-top:12px;padding:10px 12px;border-radius:12px;background:#fff6dc;font-size:14px;line-height:1.5}
/* 발표 모드 */
.present-head{display:none}
body.present .top,body.present .stepper,body.present footer,body.present .step-title,body.present .lead,body.present .course,body.present .apply,body.present .panels,body.present .nav,body.present #judge,body.present #biasBanner,body.present .score,body.present .ctrl{display:none!important}
body.present #main{position:fixed;inset:0;z-index:40;border-radius:0;border:none;padding:20px 28px;overflow:auto;background:var(--paper)}
body.present .present-head{display:flex;align-items:center;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.present-head .pe{font-size:56px;background:var(--soft);border-radius:20px;width:84px;height:84px;display:grid;place-items:center}
.present-head h2{margin:0;font-size:40px}.present-head small{color:var(--sub);font-size:16px}
.present-head .prules{display:flex;gap:6px;flex-wrap:wrap;flex:1}.present-head .prules span{border:2px solid;border-radius:999px;padding:4px 12px;font-weight:700;font-size:15px;background:#fff}
body.present .lab{grid-template-columns:1.1fr 1fr;align-items:stretch}
body.present .stage{min-height:56vh}body.present .stage .big{font-size:150px}body.present .stage .say{font-size:46px}body.present .stage .who{font-size:18px}
body.present .conf .r{font-size:17px;grid-template-columns:150px 1fr 56px}body.present .conf .r .b{height:20px}
/* 수업 제어 (학생) */
.devs{margin:12px 0;border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff}.devs h3{margin:0 0 8px}
.dv{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:8px 0;border-top:1px dashed var(--line)}.dv:first-of-type{border-top:none}
.dv small{color:var(--sub);margin-left:4px}.dv em{font-style:normal;font-weight:800;color:#b33b20;margin-left:6px;font-size:13px}.dva{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.dva select{width:auto}
.ldsteps{display:flex;flex-direction:column;gap:8px;width:100%}.ldsteps .chips button{font-size:13px}.ldsteps>.btn{align-self:flex-start}
.dv.grp{background:var(--soft);margin:6px -12px -10px;padding:10px 12px;border-radius:0 0 12px 12px;border-top:2px solid var(--line)}
.live .lock{margin-left:auto;font-size:15px}
#freeze{position:fixed;inset:0;z-index:90;background:rgba(31,42,68,.94);color:#fff;display:grid;place-items:center;text-align:center;padding:20px}
#freeze .big{font-size:110px}#freeze h2{font-size:44px;margin:10px 0}#freeze p{font-size:24px;max-width:700px}
#tpill{position:fixed;bottom:16px;left:16px;z-index:80;background:var(--ink);color:#fff;border-radius:999px;padding:8px 16px;font-weight:800;font-size:16px;box-shadow:var(--shadow)}
#tpill.warn{background:#f2b632;color:#3b2a00;animation:pulse .8s infinite alternate}#tpill.over{background:var(--accent)}
.stepper button.lock{opacity:.5}
/* 수업 제어 (교사) */
.ctrlpanel{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cp{border:2px solid var(--line);border-radius:14px;padding:12px;background:#fff;display:flex;flex-direction:column;gap:8px}
.cp>b{font-size:16px}.cp small{color:var(--sub);font-size:12px}.cp .chips button{padding:4px 10px;font-size:13px}
.cp>.btn{align-self:flex-start}
.cp .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.cp .row input,.cp .row select{flex:1;min-width:140px;padding:6px 10px}
.export{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.export .hint{flex-basis:100%}
.chip.kind{background:#efe6ff;color:#5b2fc0}
/* 연수 코스 */
.course{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 12px;border-radius:14px;background:#efe6ff;margin-bottom:14px;font-size:13px;color:#5b2fc0}
.course b{margin-right:4px}.course span{background:#fff;border-radius:999px;padding:3px 10px;font-weight:700;opacity:.7}.course span.on{background:#5b2fc0;color:#fff;opacity:1}.course span.past{opacity:.45;text-decoration:line-through}
.course small{font-weight:400}.course i{font-style:normal;opacity:.5}
details.apply{margin:-8px 0 16px;border:2px dashed #c9b5f5;border-radius:12px;padding:8px 14px;background:#faf7ff;font-size:14px}
details.apply summary{cursor:pointer;font-weight:800;color:#5b2fc0}details.apply p{margin:8px 0 2px}
/* 체험 */
.trybtn{margin-left:auto;background:#5b2fc0!important;color:#fff;border-color:#5b2fc0!important}
.overlay.try{z-index:70}.overlay.try .lab{max-width:1200px;margin:16px auto}
.ov-head h2 small{font-family:Pretendard;font-size:14px;color:var(--sub);margin-left:6px}
.rulebox{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--soft);font-size:14px;line-height:1.6}
@media (max-width:760px){.sense-grid,.panels,.ctrlpanel{grid-template-columns:1fr}body.present .lab{grid-template-columns:1fr}}

.pad{border:2px solid var(--ink);border-radius:18px;overflow:hidden;background:#fff}
.pad-tools{display:flex;flex-wrap:wrap;gap:10px;padding:10px;background:var(--soft);border-bottom:2px solid var(--ink)}
.tg{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.tb{border:2px solid var(--line);background:#fff;border-radius:10px;padding:5px 9px;cursor:pointer;font-weight:700;font-size:14px;display:grid;place-items:center;min-width:34px;min-height:34px}
.tb.on{border-color:var(--accent);background:var(--soft);box-shadow:inset 0 0 0 1px var(--accent)}
.tb i{display:block;border-radius:50%;background:var(--ink)}
.tb.st{font-size:20px;padding:2px 6px}
.sw{width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);cursor:pointer}
.sw.on{box-shadow:0 0 0 3px var(--ink)}
.pad-stage{position:relative;line-height:0}
#padBg{display:block;width:100%;height:auto}
#padCv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.tl{font-size:12px;font-weight:700;color:var(--sub);margin-right:2px}
.pad-hint{font-size:13px;color:var(--sub);padding:8px 12px;border-top:1px dashed var(--line)}
.icard .idraw{background:#fff;border-bottom:2px dashed var(--line);padding:8px}
.icard .idraw img{display:block;width:100%;height:auto}

.aibox{margin-top:18px;border:2px solid var(--ink);border-radius:18px;padding:16px;background:linear-gradient(180deg,#f4efff,#fff 120px)}
.aih{display:flex;gap:10px;align-items:center}.aih>span{font-size:30px}.aih b{font-size:22px;font-weight:400;display:block}.aih small{color:var(--sub)}
.aiacts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}
a.btn{text-decoration:none}
.aistat{margin-top:10px;font-weight:700;font-size:14px;color:#6b3fd6}
.aisteps{margin:12px 0 0;padding-left:20px;font-size:14px;color:var(--sub)}

const IDEA_TOOLS=[['scamper','🔄','스캠퍼','바꾸고·합치고·없애며 새 아이디어 만들기'],['reverse','🙃','역발상','당연한 것을 거꾸로 뒤집어 생각하기'],['force','🧩','강제결합법','관계없는 두 가지를 억지로 합치기'],['flaw','🔎','결점 열거법','지금 쓰는 물건의 결점을 찾아 고치기']];
const SCAMPER=[['S','대체하기','Substitute','카메라를 마이크나 자세 인식으로 바꾸면? 사람이 하던 일을 AI가 대신하면?'],

function ideaP(){const I=S.idea=S.idea||{};I.tool=I.tool||'scamper';I.ideas=I.ideas||[];I.sc=I.sc||{};I.rev=Object.assign({now:'',flip:'',idea:''},I.rev);I.frc=Object.assign({a:'',b:'',idea:''},I.frc);I.flaw=Object.assign({item:'',f0:'',f1:'',f2:'',idea:''},I.flaw);I.reason=I.reason||'';I.pick=I.pick||null;I.used=I.used||[];return I}

  if(I.tool==='reverse')return `<div class="pane"><h3>🙃 역발상 기법</h3><p class="hint">"당연하다"고 생각한 것을 일부러 거꾸로 뒤집어 보면 새 아이디어가 나와요.</p>

    <label class="f">3️⃣ 뒤집어서 생각한 아이디어는?</label><input type="text" data-idea="rev.idea" value="${v('rev.idea')}" placeholder="예) 쓰레기통이 먼저 어느 통인지 알려 줘서 고민하지 않아도 된다">

  if(I.tool==='force'){const A=I.frc.a,B=I.frc.b;return `<div class="pane"><h3>🧩 강제결합법</h3><p class="hint">관계없어 보이는 두 가지를 뽑아 억지로 합쳐 봐요. 엉뚱할수록 새로운 아이디어가 나와요!</p>

  [['발명품',by+8],['설계',by+38],['날짜',by+64]].forEach(([t,y])=>x.fillText(t,rx,y+3));
  x.fillStyle=P.ink;x.font='20px Jua, Pretendard, sans-serif';x.fillText(cut(S.name||'(발명품 이름)',16),rx+48,by+6);

  x.lineWidth=1;x.strokeStyle=P.sub;[by+32,by+58].forEach(y=>{x.beginPath();x.moveTo(split,y);x.lineTo(W-m,y);x.stroke()})}

function initPad(){const cv=$('#padCv'),bgc=$('#padBg');if(!cv)return;const x=cv.getContext('2d');pad.cv=cv;pad.x=x;pad.bg=bgc.getContext('2d');pad.undo=[];
  S.parts=S.parts||[];drawBg(pad.bg);if(document.fonts)document.fonts.ready.then(()=>pad.bg&&drawBg(pad.bg));
  const layer=S.drawingLayer||(S.drawing&&!S.drawingLayer&&S.drawing.startsWith('data:image/png')?S.drawing:'');
  if(layer){const im=new Image();im.onload=()=>x.drawImage(im,0,0,PW,PH);im.src=layer}
  let drag=null;
  const pos=e=>{const r=cv.getBoundingClientRect();let p={x:(e.clientX-r.left)*PW/r.width,y:(e.clientY-r.top)*PH/r.height};return p};

    else if(pad.tool==='circle'){x.ellipse((a.x+b.x)/2,(a.y+b.y)/2,Math.abs(b.x-a.x)/2,Math.abs(b.y-a.y)/2,0,0,7)}

    else if(pad.tool==='callout'){x.lineWidth=Math.max(2,pad.size/2);x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.lineTo(b.x+(b.x>=a.x?30:-30),b.y);x.stroke();x.beginPath();x.arc(a.x,a.y,4,0,7);x.fill();return}

    if(pad.tool==='stamp'){snap();const nm=pad.custom||(STAMPS.find(s=>s[0]===pad.stamp)||[])[1]||'부품';const n=S.parts.length+1;
      x.globalCompositeOperation='source-over';if(pad.stamp){x.font='46px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(pad.stamp,raw.x,raw.y)}

    snap();cv.setPointerCapture(e.pointerId);drag={a:p,last:p,base:x.getImageData(0,0,PW,PH)};

function b64enc(u){let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
function b64dec(b){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
function encodeRaw(raw){const out={};for(const id in raw){const [n,d]=raw[id].shape,arr=raw[id].data;const stepR=Math.max(1,n/40),rows=[];for(let r=0;r<n&&rows.length<40;r+=stepR)rows.push(Math.floor(r));
  const u=new Uint8Array(rows.length*d),mins=[],maxs=[];rows.forEach((r,ri)=>{let mn=Infinity,mx=-Infinity;for(let j=0;j<d;j++){const v=arr[r*d+j];if(v<mn)mn=v;if(v>mx)mx=v}const sc=(mx-mn)||1;
    mins.push(+mn.toFixed(6));maxs.push(+mx.toFixed(6));for(let j=0;j<d;j++)u[ri*d+j]=Math.round((arr[r*d+j]-mn)/sc*255)});
  out[id]={n:rows.length,d,mins,maxs,b64:b64enc(u)}}return out}
function decodeEnc(enc){const obj={};for(const id in enc){const e=enc[id],u=b64dec(e.b64),f=new Float32Array(e.n*e.d);
  for(let r=0;r<e.n;r++){const mn=e.mins[r],sc=(e.maxs[r]-mn)||1;for(let j=0;j<e.d;j++)f[r*e.d+j]=mn+u[r*e.d+j]/255*sc}obj[id]=tf.tensor2d(f,[e.n,e.d])}return obj}

/* ---------- 학습 데이터 기기 저장 (IndexedDB) ---------- */
const IDB_NAME='aiInventLab',IDB_STORE='kv';
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open(IDB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore(IDB_STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbSet(k,v){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction(IDB_STORE,'readwrite');t.objectStore(IDB_STORE).put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function idbGet(k){const d=await idb();return new Promise((res,rej)=>{const r=d.transaction(IDB_STORE).objectStore(IDB_STORE).get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function rawDataset(){const ds=knn.getClassifierDataset(),out={};for(const k in ds){out[k]={shape:ds[k].shape,data:ds[k].dataSync().slice()}}return out}
let dsT;function saveDataset(){clearTimeout(dsT);dsT=setTimeout(async()=>{if(!knn||biasStash)return;try{
  const out=rawDataset();await idbSet('dataset',{sense:sense(),model:sense()==='image'?MODEL_TAG:'',data:out});await idbSet('thumbs',{...thumbs});S.dataSaved=Object.keys(out).length>0;save();backupData()}catch(e){}},800)}
async function savedRaw(){try{const raw=await idbGet('dataset');if(!raw)return null;const data=raw.data&&raw.sense?raw.data:raw;return{sense:raw.sense||'image',model:raw.model||'',data}}catch(e){return null}}
async function restoreDataset(){try{const r=await savedRaw();if(!r||r.sense!==sense()||(r.sense==='image'&&r.model!==MODEL_TAG))return 0;const ids=new Set(S.classes.map(c=>c.id)),obj={};let n=0;
  for(const k in r.data){if(!ids.has(k))continue;obj[k]=tf.tensor2d(r.data[k].data,r.data[k].shape);n+=r.data[k].shape[0]}
  if(n)knn.setClassifierDataset(obj);const th=await idbGet('thumbs')||{};for(const k in th)if(ids.has(k))thumbs[k]=th[k];return n}catch(e){return 0}}
function clearDataset(){S.dataSaved=false;try{idbSet('dataset',{});idbSet('thumbs',{})}catch(e){}}

/* ---------- 실시간 판단 (본 시험 · 친구 발명품 체험 공용) ---------- */
function makeRunner(o){let on=false,timer=null,lastShown=null,stable={id:null,n:0};
  const R={last:null,lastFeat:null,start(){on=true;lastShown=null;stable={id:null,n:0};clearTimeout(timer);tick()},stop(){on=false;clearTimeout(timer)},reset(){lastShown=null}};
  async function tick(){if(!on)return;const k=o.knn(),s=o.sense();
    if(k&&ready[s]&&mediaOn(s)&&o.trained()){let f=null;try{f=await extract(s);if(f&&on){const total=Object.values(k.getClassExampleCount()).reduce((a,b)=>a+b,0);
      const r=await k.predictClass(f,Math.min(7,total));R.lastFeat=f.dataSync().slice();show(r)}}catch(e){}finally{if(f)f.dispose()}}
    if(on)timer=setTimeout(tick,s==='image'?120:150)}
  function show(r){const cls=o.classes();let best=null,bv=0;
    cls.forEach(c=>{const v=Math.round((r.confidences[c.id]||0)*100);const b=$('#'+o.p+'b_'+c.id),t=$('#'+o.p+'v_'+c.id);if(b)b.style.width=v+'%';if(t)t.textContent=v+'%';if(v>bv){bv=v;best=c}});
    const id=bv>=o.thr()&&best?best.id:'_unsure';R.last={id,conf:bv,best:best&&best.id};
    if(stable.id===id)stable.n++;else stable={id,n:1};
    if(stable.n<3||lastShown===id)return;lastShown=id;const st=$(o.stage);if(!st)return;
    if(id==='_unsure'){st.style.background='#fff';st.innerHTML='<div class="big">🤔</div><div class="say">잘 모르겠어요…</div><div class="who">확신이 기준보다 낮아요</div>';return}
    const i=cls.indexOf(best);st.style.background=colorOf(i)+'22';
    st.innerHTML=`<div class="big">${esc(best.emoji)}</div><div class="say">${esc(best.msg||best.name)}</div><div class="who">AI 생각: "${esc(best.name)}" (${bv}%)</div>`;
    playSound(best.sound);if(o.tts()&&best.msg)speak(best.msg)}
  return R}
const mainRunner=makeRunner({knn:()=>knn,sense:()=>sense(),trained:()=>trainedReady()&&isReady(),classes:()=>S.classes,p:'c',stage:'#stage',thr:()=>threshold,tts:()=>ttsOn});

/* 소리 */
let ac=null;
function playSound(k){if(!k||k==='none')return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  const seq={ding:[[880,.12],[660,.2]],buzz:[[220,.18],[0,.06],[220,.18]],melody:[[523,.1],[659,.1],[784,.1],[1047,.22]]}[k]||[];
  let t=ac.currentTime;seq.forEach(([f,d])=>{if(f){const o=ac.createOscillator(),g=ac.createGain();o.type=k==='buzz'?'square':'sine';o.frequency.value=f;
    g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)}t+=d})}catch(e){}}
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=1.05;setTimeout(()=>speechSynthesis.speak(u),250)}catch(e){}}

function toast(t){let d=$('#toast');if(!d){d=document.createElement('div');d.id='toast';d.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2a44;color:#fff;padding:12px 20px;border-radius:14px;z-index:99;font-weight:700;max-width:90vw;text-align:center;transition:opacity .3s;pointer-events:none';document.body.appendChild(d)}
  d.textContent=t;d.style.opacity=1;clearTimeout(d._t);d._t=setTimeout(()=>d.style.opacity=0,2600)}

  if(t.dataset.tkind){tKindSel=t.dataset.tkind;document.querySelectorAll('#tKindPick button').forEach(b=>b.classList.toggle('on',b===t));const hn=$('#tKindHint');if(hn)hn.textContent=tKindSel==='training'?'⚡ 예시 발명품으로 30분 만에 전 과정을 체험하는 코스가 켜지고, 단계마다 "우리 반에 적용할 때" 팁이 보여요.':'학생들이 문제 찾기부터 차근차근 진행해요.';return}
  if(t.dataset.tgsel){tGrpSel=+t.dataset.tgsel;document.querySelectorAll('#tGrpPick button').forEach(b=>b.classList.toggle('on',b===t));return}
  if(t.dataset.tgrp){const v=Math.max(1,Math.min(20,(T.groups||6)+(+t.dataset.tgrp)));cRef(T.code,'groups').set(v);return}
  if(t.dataset.tmax!=null){const v=+t.dataset.tmax;cRef(T.code,'ctrl/maxStep').set(v<0?null:v);if(v>=0){const over=Object.entries(T.teams||{}).filter(([id,x])=>x&&x.step>v).map(([id])=>gLabel(id));if(over.length)toast(`${over.join(', ')}이 더 앞 단계에 있어서 ${v+1}단계로 돌아가요.`)}return}
  if(t.dataset.tgg){const id=t.dataset.tgg;if(id==='all')tGotoSel.clear();else tGotoSel.has(id)?tGotoSel.delete(id):tGotoSel.add(id);tGotoStep=+($('#cpGoto')?.value||0);drawCtrl();return}
  if(t.hasAttribute('data-tgoto')){const v=+$('#cpGoto').value,ts=Date.now();
    if(tGotoSel.size){const up={},ids=[...tGotoSel];ids.forEach(id=>{up['gotoT/'+id]={step:v,ts}});cRef(T.code,'ctrl').update(up);ids.forEach(id=>tLog(id,`➡️ ${v+1}단계로 이동시켰어요`));toast(`${ids.map(gLabel).join(', ')}을 ${v+1}단계로 이동시켰어요.`);tGotoSel.clear();drawCtrl()}
    else{cRef(T.code,'ctrl/goto').set({step:v,ts});toast(`모든 모둠을 ${v+1}단계로 이동시켰어요.`)}return}
  if(t.dataset.ldstep!=null){ldStep=+t.dataset.ldstep;const dv=$('#ldDev');if(dv){dv._h=null;dv._pending=null}drawLiveDetail();return}
  if(t.dataset.tgotoone){const id=t.dataset.tgotoone,v=ldStep||0;cRef(T.code,'ctrl/gotoT/'+id).set({step:v,ts:Date.now()});tLog(id,`➡️ ${v+1}단계로 이동시켰어요`);toast(`${gLabel(id)}을 ${v+1}단계로 이동시켰어요.`);return}
  if(t.dataset.tlockdev){const [dev,id,...nm]=t.dataset.tlockdev.split('|'),name=nm.join('|'),on=!!((T.ctrl||{}).lockDev||{})[dev];
    cRef(T.code,'ctrl/lockDev/'+dev).set(on?null:{team:id,name,ts:Date.now()});tLog(id,on?`🔓 ${name} 기기 잠금을 풀었어요`:`🔒 ${name} 기기를 잠갔어요`);toast(on?`${name} 기기 잠금을 풀었어요.`:`${name} 기기를 잠갔어요.`);return}
  if(t.dataset.tlockteam){const id=t.dataset.tlockteam,on=!!((T.ctrl||{}).lockTeam||{})[id];
    cRef(T.code,'ctrl/lockTeam/'+id).set(on?null:{ts:Date.now()});tLog(id,on?'🔓 모둠 전체 잠금을 풀었어요':'🔒 모둠 기기를 모두 잠갔어요');toast(on?`${gLabel(id)} 잠금을 풀었어요.`:`${gLabel(id)} 기기를 모두 잠갔어요.`);return}
  if(t.dataset.tpromote){const [id,dev,...nm]=t.dataset.tpromote.split('|'),name=nm.join('|'),cur=((T.teams||{})[id]||{}).device||null;
    if(!confirm(`${gLabel(id)}의 본부 기기를 '${name}' 기기로 바꿀까요?\n\n· 지금 본부 기기가 켜져 있으면 마지막 기록을 넘겨주고 연결이 멈춰요.\n· 지금 본부 기기가 꺼져 있으면 학급 서버에 마지막으로 백업된 기록으로 이어서 해요.\n· AI 학습 자료는 백업된 자료(종류마다 최대 40개)로 옮겨져요.`))return;
    await cRef(T.code,'teams/'+id+'/promoted').set({dev,from:cur,ts:Date.now()});await cRef(T.code,'teams/'+id+'/device').set(dev);
    if(((T.ctrl||{}).lockDev||{})[dev])cRef(T.code,'ctrl/lockDev/'+dev).set(null);tLog(id,`👑 '${name}' 기기를 본부로 바꿨어요`);toast(`'${name}' 기기가 새 본부가 돼요. 몇 초 걸려요.`);return}
  if(t.hasAttribute('data-tfreeze')){const on=!(T.ctrl?.freeze?.on);cRef(T.code,'ctrl/freeze').set({on,msg:$('#cpMsg').value.trim()});return}
  if(t.dataset.ttimer){const m=+t.dataset.ttimer;cRef(T.code,'ctrl/timer').set({end:Date.now()+m*60000,label:$('#cpTLabel').value.trim()});toast(`${m}분 타이머를 시작했어요.`);return}
  if(t.hasAttribute('data-ttimerstop')){cRef(T.code,'ctrl/timer').remove();return}
  if(t.dataset.tprint){printCards(t.dataset.tprint);return}
  if(t.hasAttribute('data-txlsx')){exportXlsx();return}
  if(t.dataset.tlive){liveOpen=t.dataset.tlive;ldStep=null;drawLiveDetail();return}
  if(t.hasAttribute('data-tliveclose')){liveOpen=null;drawLiveDetail();return}
  if(t.dataset.trelease){const id=t.dataset.trelease;if(!confirm(`${id.replace('g','')}모둠의 기기 연결을 풀까요?\n지금 쓰던 기기는 연결이 멈추고, 다른 기기에서 이어서 할 수 있어요.`))return;cRef(T.code,'teams/'+id+'/device').set(null);toast('기기 연결을 풀었어요.');return}
  if(t.hasAttribute('data-tdelclass')){if(!confirm(`'${T.meta?.name||''}' 학급을 삭제할까요?\n모든 모둠 기록·발명 카드·AI 자료가 지워지고 되돌릴 수 없어요.\n필요하면 먼저 "엑셀 파일 내려받기"로 결과를 저장해 두세요.`))return;
    const v=prompt(`정말 삭제하려면 학급 코드 ${T.code}를 입력해 주세요.`);if((v||'').trim().toUpperCase()!==T.code){toast('코드가 달라서 삭제하지 않았어요.');return}
    const code=T.code;try{for(const k of ['meta','ctrl','cards','requests','aiimg','models','backup','inbox','shared','helpers','live','logs','teams','groups','open'])await cRef(code,k).remove();
      try{localStorage.setItem(TCKEY,JSON.stringify(tSaved().filter(x=>x.code!==code)));sessionStorage.removeItem('aiInventLab.auth.'+code)}catch(e){}
      offAll(tRefs);clearInterval(tTimer);T={code:null,teams:{},cards:{},reqs:{}};renderTeacher();toast('학급을 삭제했어요.')}catch(e){toast('삭제하지 못했어요. Firebase 규칙을 확인해 주세요.')}return}
  if(t.dataset.tapprove){cRef(T.code,'cards/'+t.dataset.tapprove).update({status:'approved',note:''});toast('승인했어요! 학생 갤러리에 올라가요.');return}
  if(t.dataset.tunapprove){cRef(T.code,'cards/'+t.dataset.tunapprove).update({status:'pending'});return}
  if(t.dataset.treject){const n=prompt('학생에게 남길 한마디 (예: AI 작동 규칙을 더 자세히 써 보자)','');if(n===null)return;cRef(T.code,'cards/'+t.dataset.treject).update({status:'rejected',note:n});toast('다시 고치기를 요청했어요.');return}
  if(t.dataset.tdelcard){if(confirm('이 카드를 갤러리에서 삭제할까요?'))cRef(T.code,'cards/'+t.dataset.tdelcard).remove();return}
  if(t.dataset.tdelteam){if(confirm('이 모둠의 진행 기록과 카드를 삭제할까요?')){['requests','aiimg'].forEach(k=>cRef(T.code,k+'/'+t.dataset.tdelteam).remove());cRef(T.code,'teams/'+t.dataset.tdelteam).remove();cRef(T.code,'cards/'+t.dataset.tdelteam).remove()}return}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.k&&SHARED_KEYS.has('k_'+t.dataset.k))writeShared('k_'+t.dataset.k,t.value);
  if(t.dataset.r&&SHARED_KEYS.has('r_'+t.dataset.r))writeShared('r_'+t.dataset.r,t.value);
  if(t.dataset.idea!=null){ideaSet(t.dataset.idea,t.value);save();return}
  if(t.dataset.itext){const x=ideaP().ideas.find(y=>y.id===t.dataset.itext);if(x){x.text=t.value;save()}return}
  if(t.dataset.hs){writeShared(t.dataset.hs,t.value);return}
  if(t.dataset.k){S[t.dataset.k]=t.value;if(t.dataset.k==='nick'){S.team=teamLabel();renderStepper()}save();if(['place','who','when','what'].includes(t.dataset.k))upProb();if(t.dataset.k==='team')renderStepper();if(['name','team','nick'].includes(t.dataset.k))recompose();if(['name','oneline','place'].includes(t.dataset.k)&&!aiP().edited){const p=$('#aiPrompt');if(p)p.value=buildPrompt()}if(S.step===6)upCard();if(S.step===3)upRules();return}
  if(t.dataset.ai){const a=aiP();if(t.dataset.ai==='prompt'){a.prompt=t.value;a.edited=true}else{a[t.dataset.ai]=t.value;if(!a.edited){const p=$('#aiPrompt');if(p)p.value=buildPrompt()}}save();return}
  if(t.dataset.r){S.reflect[t.dataset.r]=t.value;save();upCard();return}
  if(t.dataset.mnote){S.missions=S.missions||{};S.missions[t.dataset.mnote]={...(S.missions[t.dataset.mnote]||{}),note:t.value};save();return}
  if(t.dataset.cls){const c=S.classes.find(x=>x.id===t.dataset.cls);if(c){c[t.dataset.f]=t.value;save();upRules()}return}
  if(t.id==='thr'){threshold=+t.value;$('#thrV').textContent=threshold+'%';mainRunner.reset();return}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='joinCode')lookupClass();if(e.key==='Enter'&&e.target.id==='masterPw')masterCheck()});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='tOpen'){cRef(T.code,'open').set(t.checked);return}
  if(t.id==='tViewMode'){cRef(T.code,'ctrl/viewMode').set(t.checked?true:null);toast(t.checked?'👀 보기 모드로 바꿨어요. 이제 들어오는 학생은 보기 전용이에요.':'✏️ 편집 모드로 돌아왔어요.');return}
  if(t.id==='cpLiveCam'){cRef(T.code,'ctrl/liveCam').set(t.checked);return}
  if(t.id==='tts'){ttsOn=t.checked;if(!ttsOn)try{speechSynthesis.cancel()}catch(_){};return}
  if(t.id==='adFile'&&t.files[0]){loadPadImage(t.files[0]);t.value='';return}
  if(t.id==='adRecolor'){pad.adRecolor=t.checked;if(pad.src){buildPadImg();padRefreshTools()}return}
  if(t.hasAttribute('data-aiup')&&t.files[0]){shrinkImg(t.files[0]).then(u=>{S.aiImage=u;save();reAI();toast('AI 그림을 붙였어요!')}).catch(()=>toast('이미지를 열 수 없어요.'));t.value='';return}
  if(t.dataset.tupimg&&t.files[0]){const id=t.dataset.tupimg;shrinkImg(t.files[0]).then(async u=>{await cRef(T.code,'aiimg/'+id).set(u);await cRef(T.code,'requests/'+id+'/status').set('done');toast('학생에게 그림을 보냈어요!')}).catch(()=>toast('보내지 못했어요.'));t.value='';return}
  if(t.dataset.up){uploadImgs([...t.files],t.dataset.up);t.value='';return}
  if(t.dataset.cls&&t.dataset.f==='sound'){playSound(t.value)}
});
function upProb(){S.problem='';const p=$('#probAuto');if(p)p.textContent=problemAuto();save()}
function upRules(){const r=$('#rulePrev');if(r)r.innerHTML=rulesText()}
function upCard(){const p=$('#cardPrev');if(p)p.innerHTML=cardHTML(cardData())}
document.addEventListener('pointerdown',e=>{const hb=e.target.closest('[data-hhold]');if(hb&&!hb.disabled){e.preventDefault();hb.setPointerCapture?.(e.pointerId);startHelperHold(hb.dataset.hhold,hb);return}const b=e.target.closest('[data-hold]');if(!b||b.disabled)return;e.preventDefault();b.setPointerCapture?.(e.pointerId);startHold(b.dataset.hold,b)});
['pointerup','pointercancel','pointerleave'].forEach(ev=>document.addEventListener(ev,e=>{if(holdT&&(ev!=='pointerleave'||e.target.closest?.('[data-hold]')))endHold();if(hHoldT&&(ev!=='pointerleave'||e.target.closest?.('[data-hhold]')))endHelperHold()},true));
document.addEventListener('focusin',e=>{const k=sharedKeyOf(e.target);if(k)setTyping(k,true)});
document.addEventListener('focusout',e=>{const k=sharedKeyOf(e.target);if(k)setTyping(k,false)});
window.addEventListener('blur',endHold);
document.addEventListener('pointerdown',()=>{try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}catch(e){}},{once:true,capture:true});

render();
if(mode==='student'&&S.dataSaved&&S.step<4)loadModel();
if(mode==='student'&&S.step>0&&S.visited.length>1)setTimeout(()=>toast(`지난번에 하던 ${S.step+1}단계 '${STEPS[S.step].t}'부터 이어서 해요!`),400);
</script>
